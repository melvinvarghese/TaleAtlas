<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <title>TaleAtlas browser smoke tests</title>
  <style>.hidden { display: none !important; }</style>
</head>
<body>
  <header>
    <a id="brand-home" href="#top">TaleAtlas</a>
    <nav>
      <button id="contents-top" type="button">Contents</button>
      <button id="about-button" type="button">About</button>
    </nav>
  </header>
  <main id="top">
    <section id="welcome">
      <button id="open-book" type="button">Open book</button>
      <button id="cover-stage" type="button">Open cover</button>
    </section>
    <section id="reader" class="hidden">
      <h1 id="reader-title" tabindex="-1">Contents</h1>
      <button id="close-book" type="button">Close book</button>
      <div class="book">
        <article id="left-page"></article>
        <article id="right-page"></article>
        <div id="page-turn"></div>
      </div>
      <button id="prev" type="button" disabled>Previous</button>
      <span id="page-counter">Contents</span>
      <button id="next" type="button">Begin reading</button>
    </section>
    <section>
      <label for="search">Search stories</label>
      <input id="search" type="search">
      <label for="region-filter">Filter by region</label>
      <select id="region-filter">
        <option value="all">All regions</option>
        <option value="Africa">Africa</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Ancient Greece">Ancient Greece</option>
      </select>
      <span id="story-count">12 stories</span>
      <div id="story-grid"></div>
    </section>
  </main>
  <dialog id="about-dialog"><button id="about-close" type="button">Close</button></dialog>
  <pre id="test-result" data-status="running">Running…</pre>
  <script src="stories.js"></script>
  <script src="script.js"></script>
  <script src="tests/smoke.js"></script>
</body>
</html>
